databaseChangeLog:
  - changeSet:
      id: Create cars table
      author: Farid Hacibabazade
      changes:
        - createTable:
            tableName: cars
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: brand
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: fuel_type
                  type: varchar(128)
              - column:
                  name: price
                  type: numeric(16,2)
              - column:
                  name: status
                  type: varchar(25)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp



            remark: Table to store information about cars